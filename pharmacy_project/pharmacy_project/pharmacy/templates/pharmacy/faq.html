{% extends "pharmacy/base.html" %}

{% block title %}Вопросы и ответы - Аптека "Здоровье"{% endblock %}

{% block content %}
<h2>Часто задаваемые вопросы</h2>

<div class="accordion" id="faqAccordion">
    {% for faq in questions %}
    <div class="accordion-item">
        <h3 class="accordion-header" id="heading{{ forloop.counter }}">
            <button class="accordion-button {% if not forloop.first %}collapsed{% endif %}" type="button" data-bs-toggle="collapse" data-bs-target="#collapse{{ forloop.counter }}">
                {{ faq.question }}
            </button>
        </h3>
        <div id="collapse{{ forloop.counter }}" class="accordion-collapse collapse {% if forloop.first %}show{% endif %}" aria-labelledby="heading{{ forloop.counter }}" data-bs-parent="#faqAccordion">
            <div class="accordion-body">
                {{ faq.answer|linebreaks }}
            </div>
        </div>
    </div>
    {% empty %}
    <div class="alert alert-info">Раздел вопросов и ответов находится в разработке</div>
    {% endfor %}
</div>
{% endblock %}
